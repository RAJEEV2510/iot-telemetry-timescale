services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telemetry
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      # -h localhost: only passes once the real server (not the init-phase server) accepts TCP.
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d telemetry"]
      interval: 3s
      timeout: 3s
      retries: 30

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  ingestion:
    build:
      context: .
      args:
        PROJECT: Telemetry.Ingestion
    environment:
      ConnectionStrings__Timescale: Host=timescaledb;Database=telemetry;Username=postgres;Password=postgres
      Mqtt__Host: mosquitto
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_started

  api:
    build:
      context: .
      args:
        PROJECT: Telemetry.Api
    environment:
      ConnectionStrings__Timescale: Host=timescaledb;Database=telemetry;Username=postgres;Password=postgres
      Mqtt__Host: mosquitto
    ports:
      - "8080:8080"
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_started

  simulator:
    build:
      context: .
      args:
        PROJECT: Telemetry.Simulator
    environment:
      Mqtt__Host: mosquitto
      Simulator__Devices: 200
      Simulator__RatePerDevice: 5
    depends_on:
      - mosquitto
